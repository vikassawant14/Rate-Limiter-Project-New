<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Rate Limiter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">

        <div class="login-card">

            <div class="logo">
                🔐
            </div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your account
            </p>

            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit" id="loginButton">

                    Login

                </button>

            </form>


            <div id="message"></div>


            <p class="security-info">
                🛡️ Protected by API Rate Limiting
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
